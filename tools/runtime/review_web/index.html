<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采集核对工作台</title><link rel="stylesheet" href="review.css"></head>
<body><header><div><b>采集核对工作台</b><span class="muted">本地证据 · 人工草稿独立保存</span></div><nav><button id="export">导出审阅草稿</button><button id="import">导入草稿</button><input id="draft-file" type="file" accept=".json" hidden></nav></header>
<section class="toolbar"><label>记录批次<select id="session"></select></label><label class="search">检索正文 / key / 人物 / 对象<input id="query" placeholder="例如 Shut up、Tasque、spr_plugboy"></label><label>范围<select id="filter"><option value="all">全部正文</option><option value="issue">优先核对</option><option value="source">来源未绑定</option><option value="identity">头像证据不足</option><option value="unknown">人物待判断</option><option value="smallface">含 smallface</option><option value="choice">含选择关系</option><option value="interaction">有主动交互</option><option value="draft">已有草稿</option></select></label><label class="check"><input id="controls" type="checkbox">显示控制页</label></section>
<section id="stats" class="stats"></section><p id="notice" role="status"></p><main><aside><div id="count"></div><div id="list"></div></aside><section id="detail" tabindex="-1"></section></main>
<datalist id="characters"></datalist><script src="data.js"></script><script src="review.js"></script></body></html>
